# Layer 3: the enforced backstop. Catches anything that skipped the IDE/commit layers
# (e.g. `git commit --no-verify`, a fresh clone without pre-commit installed).
#
# Reusable: other repos call it with
#   jobs:
#     guardrails:
#       uses: <owner>/prompt-to-prod-secret-guardrails/.github/workflows/secret-guardrails.yml@main
#
# Gate policy: fail on NEW findings only. Historical findings live in
# .gitleaks-baseline.json (each with an owner + expiry in the README process), so turning
# this on for an old repo doesn't block every PR on day one.
#
# Hardening note: pin third-party actions to a full commit SHA in production
# (tags can be moved, as in the tj-actions/changed-files compromise, March 2025).

name: secret-guardrails

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  security-events: write   # upload SARIF so findings show inline on the PR

env:
  GITLEAKS_VERSION: "8.21.2"
  TRIVY_IMAGE: "aquasec/trivy:0.58.1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: a secret deleted in a later commit is still exposed

      - name: Install gitleaks (pinned + checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar -xzf "$tgz" gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          args=(git . --redact --no-banner --report-format sarif --report-path gitleaks.sarif)
          [ -f .gitleaks.toml ] && args+=(--config .gitleaks.toml)
          [ -f .gitleaks-baseline.json ] && args+=(--baseline-path .gitleaks-baseline.json)
          # On PRs scan only the PR's commits; on main scan full history against the baseline.
          [ -n "$BASE_SHA" ] && args+=(--log-opts="$BASE_SHA..$HEAD_SHA")
          gitleaks "${args[@]}"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SAST (OWASP Top 10), new findings only on PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args=(scan --config p/owasp-top-ten --sarif --output semgrep.sarif --error)
          [ -n "$BASE_SHA" ] && args+=(--baseline-commit "$BASE_SHA")
          semgrep "${args[@]}"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SCA + IaC misconfig (fixable HIGH/CRITICAL only)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs . \
            --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output trivy.sarif --exit-code 1
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
